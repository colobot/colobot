name: Agent Server Tests

on:
  push:
    branches: [dev, 'claude/**']
  pull_request:
    branches: [dev]

jobs:
  agent-server-linux:
    name: Agent server tests (Linux/Xvfb)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libsndfile1-dev libvorbis-dev libogg-dev libpng-dev \
            libglew-dev libopenal-dev libphysfs-dev \
            gettext po4a libglm-dev \
            xvfb mesa-utils libgl1-mesa-dri \
            curl python3

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOLOBOT_DEVELOPMENT_MODE=ON \
            -DTESTS=OFF \
            -G Ninja

      - name: Build
        run: cmake --build build --target colobot -j$(nproc)

      - name: Copy shaders
        run: cmake --build build --target UpdateShaders

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 1

      - name: Start agent server
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          build/colobot \
            -agentserver 7777 \
            -datadir build/data/ \
            -glversion 3.3 -glprofile core \
            -resolution 640x480 \
            </dev/null >agent-server.log 2>&1 &
          echo $! > agent-server.pid

      - name: Wait for /health
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:7777/health >/dev/null 2>&1; then
              echo "Agent server ready after ${i}s"
              break
            fi
            if ! kill -0 $(cat agent-server.pid) 2>/dev/null; then
              echo "ERROR: agent server exited early"
              cat agent-server.log
              exit 1
            fi
            sleep 1
          done

      - name: Milestone 0 — /health
        run: |
          curl -sf http://127.0.0.1:7777/health | python3 -m json.tool
          curl -sf http://127.0.0.1:7777/health | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['ok'], f'health not ok: {d}'
          assert d['data']['status'] == 'ok'
          print('PASS: /health')
          "

      - name: Milestone 1 — /state shows PlayerSelect
        run: |
          STATE=$(curl -sf http://127.0.0.1:7777/state)
          echo "$STATE" | python3 -m json.tool
          echo "$STATE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['ok'], f'state not ok: {d}'
          assert d['data']['screen'] == 'PlayerSelect', f'expected PlayerSelect, got: {d[\"data\"][\"screen\"]}'
          ids = [w['id'] for w in d['data']['widgets']]
          assert 'EditPlayerName' in ids, f'EditPlayerName not found in {ids}'
          assert 'ButtonOK' in ids, f'ButtonOK not found in {ids}'
          print('PASS: /state screen=PlayerSelect with EditPlayerName and ButtonOK')
          "

      - name: Milestone 2 — type player name and click OK
        run: |
          curl -sf -X POST http://127.0.0.1:7777/type \
            -H 'Content-Type: application/json' \
            -d '{"id":"EditPlayerName","text":"Claude"}' | python3 -m json.tool

          curl -sf -X POST http://127.0.0.1:7777/click \
            -H 'Content-Type: application/json' \
            -d '{"id":"ButtonOK"}' | python3 -m json.tool

          sleep 2

          STATE=$(curl -sf http://127.0.0.1:7777/state)
          echo "$STATE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          screen = d['data']['screen']
          assert screen != 'PlayerSelect', f'still on PlayerSelect after clicking OK'
          print(f'PASS: advanced to screen={screen}')
          "

      - name: Milestone 3 — /screenshot returns a PNG
        run: |
          curl -sf http://127.0.0.1:7777/screenshot | python3 -c "
          import sys, json, base64
          d = json.load(sys.stdin)
          assert d['ok'], f'screenshot not ok: {d}'
          png = base64.b64decode(d['data']['png'])
          assert len(png) > 1000, f'PNG too small: {len(png)} bytes'
          assert png[:4] == b'\x89PNG', 'not a valid PNG'
          open('screenshot.png', 'wb').write(png)
          print(f'PASS: /screenshot returned {len(png)}-byte PNG')
          "

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-server-screenshot
          path: screenshot.png
          if-no-files-found: ignore

      - name: Upload agent server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-server-log
          path: agent-server.log

      - name: Stop agent server
        if: always()
        run: kill $(cat agent-server.pid) 2>/dev/null || true
